/* --- base.css --- */
/* AS Computer - base.css */
:root {
  --bg-primary: #0b0f19;
  --bg-secondary: #111827;
  --bg-card: #1f2937;
  --bg-card-hover: #283548;
  --border-color: #374151;
  --border-light: #4b5563;
  
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --text-dim: #6b7280;
  
  --accent-blue: #3b82f6;
  --accent-blue-hover: #2563eb;
  --accent-purple: #8b5cf6;
  --accent-cyan: #06b6d4;
  
  --status-success: #10b981;
  --status-warning: #f59e0b;
  --status-danger: #ef4444;
  --status-info: #3b82f6;

  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.6);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-primary);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  color: var(--accent-blue);
  text-decoration: none;
}

button, input, select, textarea {
  font-family: inherit;
}

/* --- layout.css --- */
/* AS Computer - layout.css */
.app-header {
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0.75rem 1.25rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.brand-logo {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: #fff;
  font-size: 1.1rem;
}

.brand-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
}

.header-status-area {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-bar {
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  overflow-x: auto;
  padding: 0 0.5rem;
}

.nav-item {
  padding: 0.75rem 1rem;
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.nav-item:hover {
  color: var(--text-main);
}

.nav-item.active {
  color: var(--accent-blue);
  border-bottom-color: var(--accent-blue);
  background-color: rgba(59, 130, 246, 0.05);
}

.main-content {
  flex: 1;
  padding: 1.25rem;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1.25rem;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
}

@media (max-width: 768px) {
  .main-content {
    padding: 0.75rem;
  }
  .app-header {
    padding: 0.5rem 0.75rem;
  }
}

/* --- components.css --- */
/* AS Computer - components.css */
/* Cards */
.card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  padding-bottom: 0.5rem;
}

.card-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-main);
}

/* Metric Widget */
.metric-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.metric-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.metric-value {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-main);
}

.metric-sub {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* Status Badges */
.badge {
  padding: 0.2rem 0.5rem;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.badge-online { background-color: rgba(16, 185, 129, 0.15); color: var(--status-success); border: 1px solid var(--status-success); }
.badge-offline { background-color: rgba(239, 68, 68, 0.15); color: var(--status-danger); border: 1px solid var(--status-danger); }
.badge-syncing { background-color: rgba(245, 158, 11, 0.15); color: var(--status-warning); border: 1px solid var(--status-warning); }
.badge-queue { background-color: var(--accent-purple); color: #fff; border-radius: 999px; padding: 0.1rem 0.45rem; font-size: 0.7rem; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.55rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  color: #fff;
}
.btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }

.btn-secondary {
  background-color: var(--bg-card-hover);
  color: var(--text-main);
  border: 1px solid var(--border-color);
}
.btn-secondary:hover { background-color: var(--border-color); }

.btn-success { background-color: var(--status-success); color: #fff; }
.btn-danger { background-color: var(--status-danger); color: #fff; }
.btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }

/* Forms */
.form-group {
  margin-bottom: 0.9rem;
}

.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 0.3rem;
}

.form-control {
  width: 100%;
  padding: 0.55rem 0.75rem;

  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-main);

}
.form-control:focus {

  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}

/* Tables */
.table-responsive {

}

.table {

  border-collapse: collapse;
  font-size: 0.85rem;
  text-align: left;

.table th {

.table td {

  color: var(--text-main);

.table tr:hover td {

/* Denomination Grid */
.denom-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0.5rem;
  margin-top: 0.5rem;

.denom-box {

  border: 1px solid var(--border-color);
  padding: 0.5rem;
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;

}

.denom-box label {
  font-size: 0.75rem;
  color: var(--text-muted);

.denom-box input {

  border: 1px solid var(--border-color);

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;

.modal-content {

// --- utils.js ---
/**
 * AS Computer - utils.js
 */
const Utils = {
  formatCurrency: function(num) {
    const val = Number(num) || 0;
    return "৳ " + val.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  formatDate: function(dateStr) {
    if (!dateStr) return "";
    try {
      const d = new Date(dateStr);
      return d.toLocaleDateString("en-GB", { year: "numeric", month: "short", day: "numeric" });
    } catch(e) {
      return dateStr;
    }
  },

  getTodayDateIso: function() {
    const now = new Date();
    const offsetMs = 6 * 60 * 60 * 1000; // Asia/Dhaka UTC+6
    const dhakaDate = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + offsetMs);
    const yyyy = dhakaDate.getFullYear();
    const mm = String(dhakaDate.getMonth() + 1).padStart(2, "0");
    const dd = String(dhakaDate.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  },

  generateUUID: function() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  },

  debounce: function(func, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }
};

// --- ui.js ---
/**
 * AS Computer - ui.js
 */
const UI = {
  toast: function(message, type = "info") {
    const container = document.getElementById("toast-container") || document.body;
    const toastEl = document.createElement("div");
    toastEl.className = "toast";
    let icon = "ℹ️";
    if (type === "success") icon = "✅";
    if (type === "error") icon = "❌";
    if (type === "warning") icon = "⚠️";
    
    toastEl.innerHTML = `<span>${icon}</span><span>${message}</span>`;
    container.appendChild(toastEl);
    
    setTimeout(() => {
      toastEl.style.opacity = "0";
      toastEl.style.transition = "opacity 0.3s";
      setTimeout(() => toastEl.remove(), 300);
    }, 3500);
  },

  modal: function(title, bodyHtml, onConfirm = null, confirmText = "Confirm") {
    this.closeModal();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "app-modal";
    
    overlay.innerHTML = `
      <div class="modal-content">
        <div class="card-header">
          <h3 class="card-title">${title}</h3>
          <button class="btn btn-secondary btn-sm" onclick="UI.closeModal()">✕</button>
        </div>
        <div class="modal-body" style="margin: 1rem 0;">${bodyHtml}</div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.75rem;">
          <button class="btn btn-secondary" onclick="UI.closeModal()">Close</button>
          ${onConfirm ? `<button class="btn btn-primary" id="modal-confirm-btn">${confirmText}</button>` : ""}
        </div>
      </div>
    `;
    
    document.body.appendChild(overlay);
    if (onConfirm) {
      document.getElementById("modal-confirm-btn").addEventListener("click", () => {
        onConfirm();
      });
    }
  },

  closeModal: function() {
    const modal = document.getElementById("app-modal");
    if (modal) modal.remove();
  },

  updateNetworkStatus: function(isOnline) {
    const badge = document.getElementById("network-badge");
    if (!badge) return;
    if (isOnline) {
      badge.className = "badge badge-online";
      badge.innerHTML = `<span style="width:6px; height:6px; border-radius:50%; background:var(--status-success);"></span> Online`;
    } else {
      badge.className = "badge badge-offline";
      badge.innerHTML = `<span style="width:6px; height:6px; border-radius:50%; background:var(--status-danger);"></span> Offline`;
    }
  },

  updateSyncBadge: function(pendingCount) {
    const badge = document.getElementById("sync-badge");
    if (!badge) return;
    if (pendingCount > 0) {
      badge.style.display = "inline-flex";
      badge.innerText = `Pending Sync: ${pendingCount}`;
    } else {
      badge.style.display = "none";
    }
  }
};

// --- db.js ---
/**
 * AS Computer - db.js
 * IndexedDB offline-first database
 */
const DB = {
  dbName: "as_computer_offline_db",
  version: 2,
  instance: null,

  init: function() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.version);
      
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        const stores = [
          { name: "products", key: "product_id" },
          { name: "services", key: "service_id" },
          { name: "categories", key: "category_id" },
          { name: "customers", key: "customer_id" },
          { name: "settings", key: "key" },
          { name: "sales_history", key: "invoice_no" },
          { name: "outbox", key: "client_op_id" },
          { name: "cash_closings", key: "closing_date" },
          { name: "metadata", key: "key" }
        ];
        
        stores.forEach(s => {
          if (!db.objectStoreNames.contains(s.name)) {
            db.createObjectStore(s.name, { keyPath: s.key });
          }
        });
      };
      
      request.onsuccess = (e) => {
        this.instance = e.target.result;
        resolve(this.instance);
      };
      
      request.onerror = (e) => {
        console.error("IndexedDB error:", e.target.error);
        reject(e.target.error);
      };
    });
  },

  getAll: function(storeName) {
    return new Promise((resolve, reject) => {
      if (!this.instance) return resolve([]);
      const tx = this.instance.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  get: function(storeName, key) {
    return new Promise((resolve, reject) => {
      if (!this.instance) return resolve(null);
      const tx = this.instance.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  },

  put: function(storeName, record) {
    return new Promise((resolve, reject) => {
      if (!this.instance) return resolve(null);
      const tx = this.instance.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      const req = store.put(record);
      req.onsuccess = () => resolve(record);
      req.onerror = () => reject(req.error);
    });
  },

  putMany: function(storeName, records) {
    return new Promise((resolve, reject) => {
      if (!this.instance || !records || records.length === 0) return resolve([]);
      const tx = this.instance.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      records.forEach(r => store.put(r));
      tx.oncomplete = () => resolve(records);
      tx.onerror = () => reject(tx.error);
    });
  },

  delete: function(storeName, key) {
    return new Promise((resolve, reject) => {
      if (!this.instance) return resolve(false);
      const tx = this.instance.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      const req = store.delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },

  clear: function(storeName) {
    return new Promise((resolve, reject) => {
      if (!this.instance) return resolve(false);
      const tx = this.instance.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      const req = store.clear();
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }
};

// --- cache.js ---
/**
 * AS Computer - cache.js
 * In-memory fast cache for instantaneous UI response (<50ms)
 */
const Cache = {
  memoryStore: {},

  set: function(key, data, ttlSeconds = 300) {
    this.memoryStore[key] = {
      data: data,
      expiresAt: Date.now() + (ttlSeconds * 1000)
    };
  },

  get: function(key) {
    const item = this.memoryStore[key];
    if (!item) return null;
    if (Date.now() > item.expiresAt) {
      delete this.memoryStore[key];
      return null;
    }
    return item.data;
  },

  clear: function() {
    this.memoryStore = {};
  }
};

// --- offline.js ---
/**
 * AS Computer - offline.js
 * Offline transaction interception & local storage
 */
const Offline = {
  handleAction: async function(action, payload) {
    const clientOpId = Utils.generateUUID();
    const nowIso = new Date().toISOString();
    const today = Utils.getTodayDateIso();

    switch (action) {
      case "create_sale": {
        const invoiceNo = "INV-" + today.replace(/-/g, "") + "-" + Math.floor(1000 + Math.random() * 9000);
        const saleRecord = {
          invoice_no: invoiceNo,
          customer_id: payload.customer_id || "WALK-IN",
          customer_name: payload.customer_name || "General Customer",
          subtotal: payload.subtotal,
          discount: payload.discount,
          grand_total: payload.grand_total,
          paid_amount: payload.paid_amount,
          due_amount: payload.due_amount,
          payment_method: payload.payment_method || "Cash",
          date: payload.date || today,
          status: "Pending Sync (Offline)",
          items: payload.items,
          created_at: nowIso,
          client_op_id: clientOpId
        };

        // Save to local sales history & update local stock
        await DB.put("sales_history", saleRecord);
        
        if (payload.items) {
          for (const item of payload.items) {
            if (item.type === "Product" && item.item_ref_id) {
              const prod = await DB.get("products", item.item_ref_id);
              if (prod) {
                prod.stock_quantity = Math.max(0, (Number(prod.stock_quantity) || 0) - (Number(item.quantity) || 1));
                await DB.put("products", prod);
              }
            }
          }
        }

        // Queue for background synchronization
        await this.queueOperation("Sales", "CREATE", payload, clientOpId);
        UI.toast("Sale saved locally (Offline mode)", "warning");
        return { success: true, offline: true, invoice_no: invoiceNo, sale: saleRecord };
      }

      case "save_cash_closing": {
        const closingRecord = {
          ...payload,
          closing_id: "CC-OFFLINE-" + payload.closing_date.replace(/-/g, ""),
          status: "Pending Sync (Offline)",
          client_op_id: clientOpId
        };
        await DB.put("cash_closings", closingRecord);
        await this.queueOperation("CashClosing", "SAVE", payload, clientOpId);
        UI.toast("Cash closing stored locally for synchronization", "warning");
        return { success: true, offline: true, closing_id: closingRecord.closing_id, record: closingRecord };
      }

      case "record_payment": {
        const paymentId = "PAY-OFFLINE-" + Math.floor(1000 + Math.random() * 9000);
        await this.queueOperation("Payments", "CREATE", payload, clientOpId);
        UI.toast("Due payment queued for synchronization", "warning");
        return { success: true, offline: true, payment_id: paymentId };
      }

      default:
        return { success: false, message: "Action not supported offline yet: " + action };
    }
  },

  queueOperation: async function(module, opType, payload, clientOpId) {
    const queueItem = {
      client_op_id: clientOpId || Utils.generateUUID(),
      device_id: "pwa-client",
      module: module,
      type: opType,
      payload: payload,
      queued_at: new Date().toISOString()
    };
    await DB.put("outbox", queueItem);
    await Sync.updatePendingCount();
  }
};

// --- sync.js ---
/**
 * AS Computer - sync.js
 * Background synchronization engine with idempotency & conflict resolution
 */
const Sync = {
  isSyncing: false,

  init: function() {
    window.addEventListener("online", () => {
      State.isOnline = true;
      UI.updateNetworkStatus(true);
      UI.toast("Connection restored. Initiating sync...", "info");
      this.syncOutbox();
    });

    window.addEventListener("offline", () => {
      State.isOnline = false;
      UI.updateNetworkStatus(false);
      UI.toast("Operating in Offline Mode", "warning");
    });

    this.updatePendingCount();
  },

  updatePendingCount: async function() {
    const items = await DB.getAll("outbox");
    State.syncQueueCount = items.length;
    UI.updateSyncBadge(items.length);
    return items.length;
  },

  syncOutbox: async function() {
    if (this.isSyncing) return;
    const items = await DB.getAll("outbox");
    if (items.length === 0) return;

    if (!State.isOnline || !API.apiUrl) {
      console.log("Cannot sync: offline or API URL not configured");
      return;
    }

    this.isSyncing = true;
    UI.toast(`Syncing ${items.length} pending operations...`, "info");

    try {
      const response = await fetch(API.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "sync_queue",
          payload: { operations: items },
          user: State.currentUser
        })
      });

      const res = await response.json();
      if (res.success && res.results) {
        for (const itemResult of res.results) {
          if (itemResult.status === "SUCCESS" || itemResult.status === "already_processed") {
            await DB.delete("outbox", itemResult.client_op_id);
          } else if (itemResult.result && itemResult.result.conflict) {
            UI.toast(`Sync conflict: ${itemResult.result.message}`, "error");
          }
        }
        await this.updatePendingCount();
        UI.toast("Cloud synchronization complete!", "success");
      }
    } catch (e) {
      console.error("Sync error:", e);
      UI.toast("Synchronization failed. Will retry automatically.", "error");
    } finally {
      this.isSyncing = false;
    }
  }
};

// --- api.js ---
/**
 * AS Computer - api.js
 * Backend communication layer with offline fallback
 */
const API = {
  // Configured Apps Script Web App URL (empty = same origin or google.script.run)
  apiUrl: localStorage.getItem("as_computer_api_url") || "https://script.google.com/macros/s/AKfycbxa0iaQ-IQEucq4oDx7e0-1G4Gby_4qYvmj1tTq47AgsPC5mQFrIoknVnEGvnbVJLBMWQ/exec",

  call: async function(action, payload = {}) {
    // 1. If running inside Google Apps Script HTML Service directly
    if (typeof google !== "undefined" && google.script && google.script.run) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(res => resolve(res))
          .withFailureHandler(err => reject(err))
          .doPost({ action: action, payload: payload, user: State.currentUser });
      });
    }

    // 2. If running standalone PWA and offline
    if (!navigator.onLine) {
      return Offline.handleAction(action, payload);
    }

    // 3. If running standalone PWA and online
    if (this.apiUrl) {
      try {
        const response = await fetch(this.apiUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, payload: payload, user: State.currentUser })
        });
        const json = await response.json();
        return json;
      } catch (err) {
        console.warn("Network call failed, falling back to offline handler:", err);
        return Offline.handleAction(action, payload);
      }
    }

    // 4. Fallback if no remote API URL configured yet (Local Standalone Demo / Offline mode)
    return Offline.handleAction(action, payload);
  },

  bootstrap: async function() {
    // Try to load cached data from IndexedDB immediately
    const cachedProducts = await DB.getAll("products");
    const cachedServices = await DB.getAll("services");
    const cachedCustomers = await DB.getAll("customers");
    
    if (cachedProducts.length > 0) {
      State.products = cachedProducts;
      State.services = cachedServices;
      State.customers = cachedCustomers;
      State.notify("data_loaded", { source: "indexeddb" });
    }

    // Refresh from remote if online
    if (navigator.onLine && (this.apiUrl || (typeof google !== "undefined" && google.script))) {
      try {
        let res = null;
        if (typeof google !== "undefined" && google.script && google.script.run) {
          res = await new Promise((resolve) => {
            google.script.run.withSuccessHandler(resolve).doGet({ parameter: { action: "bootstrap" } });
          });
        } else if (this.apiUrl) {
          const resp = await fetch(`${this.apiUrl}?action=bootstrap`);
          res = await resp.json();
        }
        
        if (res && res.success && res.data) {
          State.products = res.data.products || [];
          State.services = res.data.services || [];
          State.customers = res.data.customers || [];
          State.settings = res.data.settings || {};
          
          // Persist to IndexedDB
          await DB.putMany("products", State.products);
          await DB.putMany("services", State.services);
          await DB.putMany("customers", State.customers);
          State.notify("data_loaded", { source: "cloud" });
        }
      } catch (e) {
        console.warn("Cloud bootstrap error:", e);
      }
    }
  }
};

      const el = document.getElementById("line-total-" + idx);
      if (el) el.innerText = Utils.formatCurrency(line);
    });

    const discount = Number(document.getElementById("sale-discount")?.value) || 0;
    const grandTotal = Math.max(0, subtotal - discount);
    
    const paidInput = document.getElementById("sale-paid");
    if (paidInput && Number(paidInput.value) === 0 && this.cart.length > 0 && !paidInput.dataset.modified) {
      paidInput.value = grandTotal;
    }
    
    const paid = Number(paidInput?.value) || 0;
    const due = Math.max(0, grandTotal - paid);

    if (document.getElementById("summary-subtotal")) {
      document.getElementById("summary-subtotal").innerText = Utils.formatCurrency(subtotal);
      document.getElementById("summary-discount").innerText = Utils.formatCurrency(discount);
      document.getElementById("summary-grand-total").innerText = Utils.formatCurrency(grandTotal);
      document.getElementById("sale-due").value = Utils.formatCurrency(due);
    }

      return;
    }

    const custSel = document.getElementById("customer-select");
    const custId = custSel.value;
    const custName = custSel.options[custSel.selectedIndex].text.split(" (")[0];
    const method = document.getElementById("payment-method").value;
    const discount = Number(document.getElementById("sale-discount").value) || 0;
    const paid = Number(document.getElementById("sale-paid").value) || 0;

    let subtotal = 0;
    this.cart.forEach(c => subtotal += (c.quantity * c.rate));
    const grandTotal = Math.max(0, subtotal - discount);
    const due = Math.max(0, grandTotal - paid);

    const payload = {
      customer_id: custId,
      customer_name: custName,
      items: this.cart,
      subtotal: subtotal,
      discount: discount,
      grand_total: grandTotal,
      paid_amount: paid,
      due_amount: due,
      payment_method: method,
      date: Utils.getTodayDateIso()
    };

    const res = await API.call("create_sale", payload);
    if (res.success) {
      UI.toast(`Invoice ${res.invoice_no} created successfully!`, "success");
      this.printInvoiceModal(res.invoice_no, payload);
      this.cart = [];
      this.renderCart();

  },

  onDateChange: function(newDate) {
    this.activeDate = newDate;
    this.loadDateData(newDate);
  },

  loadDateData: async function(targetDate) {
    const banner = document.getElementById("closing-status-banner");
    const saveBtn = document.getElementById("btn-save-closing");
    
    // Check editing permission rule:
    // Today's record: view and edit. Yesterday's record: view and edit. Older records: view and print only.
    const today = Utils.getTodayDateIso();
    const d = new Date();
    d.setDate(d.getDate() - 1);
    const yesterday = d.toISOString().split("T")[0];
    const isEditable = (targetDate === today || targetDate === yesterday);

    if (saveBtn) {
      if (isEditable) {
        saveBtn.disabled = false;
        saveBtn.style.opacity = "1";
        saveBtn.title = "Record can be saved or edited";
      } else {
        saveBtn.disabled = true;
        saveBtn.style.opacity = "0.4";
        saveBtn.title = "Older records are read-only";
      }
    }

    // Try reading local / offline cash closings first
    const existingOffline = await DB.get("cash_closings", targetDate);
    
    // Call backend API for calculation & server record
    let res = null;
    try {
      if (typeof google !== "undefined" && google.script && google.script.run) {
        res = await new Promise(resolve => {
          google.script.run.withSuccessHandler(resolve).doGet({ parameter: { action: "get_cash_closing", date: targetDate } });
        });
      } else if (API.apiUrl) {
        const resp = await fetch(`${API.apiUrl}?action=get_cash_closing&date=${targetDate}`);
        res = await resp.json();
      }
    } catch(e) {
      console.warn("Backend cash closing fetch failed:", e);
    }

    if (res && res.success && res.calculation) {
      this.currentCalculation = res.calculation;
      this.existingRecord = res.existing && res.existing.found ? res.existing.record : null;
      if (res.existing && res.existing.found && res.existing.denominations) {
        this.setDenominations(res.existing.denominations);
      }
    } else {
      // Local fallback calculation from IndexedDB
      const sales = await DB.getAll("sales_history");
      const todaySales = sales.filter(s => s.date === targetDate && String(s.payment_method).toLowerCase() === "cash");
      const salesCash = todaySales.reduce((sum, s) => sum + (Number(s.paid_amount) || 0), 0);
      
      this.currentCalculation = {
        date: targetDate,
        opening_cash: 0,
        sales_cash: salesCash,
        due_collection_cash: 0,
        shortage_adjustment: 0,
        total_inflow: salesCash,
        expenses_outflow: 0,
        other_outflow: 0,
        total_outflow: 0,
        expected_cash: salesCash
      };
      this.existingRecord = existingOffline || null;
      if (existingOffline && existingOffline.denominations) {
        this.setDenominations(existingOffline.denominations);
      }
    }

    // Update UI elements
    const calc = this.currentCalculation;
    document.getElementById("val-opening-cash").innerText = Utils.formatCurrency(calc.opening_cash);
    document.getElementById("val-sales-cash").innerText = Utils.formatCurrency(calc.sales_cash);
    document.getElementById("val-due-cash").innerText = Utils.formatCurrency(calc.due_collection_cash);
    document.getElementById("val-shortage-adj").innerText = Utils.formatCurrency(calc.shortage_adjustment);
    document.getElementById("val-total-inflow").innerText = Utils.formatCurrency(calc.total_inflow);
    document.getElementById("val-expenses-cash").innerText = Utils.formatCurrency(calc.expenses_outflow);
    document.getElementById("val-purchases-cash").innerText = Utils.formatCurrency(calc.other_outflow);
    document.getElementById("val-expected-cash").innerText = Utils.formatCurrency(calc.expected_cash);

    // Banner message
    if (banner) {
      if (this.existingRecord) {
        banner.innerHTML = `
          <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--status-success); color: var(--status-success); padding: 0.6rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;">
            <span>✅ Cash closing record exists for ${targetDate} (Status: <strong>${this.existingRecord.status}</strong>, Difference: <strong>৳${this.existingRecord.difference}</strong>)</span>
            <span>${isEditable ? '✏️ Editable' : '🔒 Read-Only'}</span>
          </div>
        `;
      } else {
        banner.innerHTML = `
          <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid var(--status-warning); color: var(--status-warning); padding: 0.6rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem;">
            ⚠️ No cash closing record found for this date. Enter physical count to reconcile.
          </div>
        `;
      }
    }

    this.onDenomChange();
  },

  setDenominations: function(d) {
    const fields = ["1000", "500", "200", "100", "50", "20", "10", "5", "2", "1"];
    fields.forEach(f => {
      const el = document.getElementById("denom-" + f);
      if (el) el.value = d["d_" + f] || 0;
    });
    const cEl = document.getElementById("denom-coins");
    if (cEl) cEl.value = d.coins_total || 0;
  },

  onDenomChange: function() {
    const d1000 = (Number(document.getElementById("denom-1000")?.value) || 0) * 1000;
    const d500 = (Number(document.getElementById("denom-500")?.value) || 0) * 500;
    const d200 = (Number(document.getElementById("denom-200")?.value) || 0) * 200;
    const d100 = (Number(document.getElementById("denom-100")?.value) || 0) * 100;
    const d50 = (Number(document.getElementById("denom-50")?.value) || 0) * 50;
    const d20 = (Number(document.getElementById("denom-20")?.value) || 0) * 20;
    const d10 = (Number(document.getElementById("denom-10")?.value) || 0) * 10;
    const d5 = (Number(document.getElementById("denom-5")?.value) || 0) * 5;
    const d2 = (Number(document.getElementById("denom-2")?.value) || 0) * 2;
    const d1 = (Number(document.getElementById("denom-1")?.value) || 0) * 1;
    const coins = Number(document.getElementById("denom-coins")?.value) || 0;

    const totalCounted = d1000 + d500 + d200 + d100 + d50 + d20 + d10 + d5 + d2 + d1 + coins;
    const expected = this.currentCalculation ? this.currentCalculation.expected_cash : 0;
    const diff = totalCounted - expected;

    document.getElementById("val-counted-cash").innerText = Utils.formatCurrency(totalCounted);
    const diffEl = document.getElementById("val-difference");
    diffEl.innerText = Utils.formatCurrency(diff);

    const statusBadge = document.getElementById("badge-closing-status");
    if (diff === 0) {
      diffEl.style.color = "var(--status-success)";
      statusBadge.className = "badge badge-online";
      statusBadge.innerText = "Matched";
    } else if (diff < 0) {
      diffEl.style.color = "var(--status-danger)";
      statusBadge.className = "badge badge-offline";
      statusBadge.innerText = `Short (৳${Math.abs(diff)})`;
    } else {
      diffEl.style.color = "var(--status-warning)";
      statusBadge.className = "badge badge-syncing";
      statusBadge.innerText = `Excess (+৳${diff})`;
    }
  },

  saveClosing: async function() {
    const calc = this.currentCalculation;
    if (!calc) return;

    const d1000 = Number(document.getElementById("denom-1000")?.value) || 0;
    const d500 = Number(document.getElementById("denom-500")?.value) || 0;
    const d200 = Number(document.getElementById("denom-200")?.value) || 0;
    const d100 = Number(document.getElementById("denom-100")?.value) || 0;
    const d50 = Number(document.getElementById("denom-50")?.value) || 0;
    const d20 = Number(document.getElementById("denom-20")?.value) || 0;
    const d10 = Number(document.getElementById("denom-10")?.value) || 0;
    const d5 = Number(document.getElementById("denom-5")?.value) || 0;
    const d2 = Number(document.getElementById("denom-2")?.value) || 0;
    const d1 = Number(document.getElementById("denom-1")?.value) || 0;
    const coins = Number(document.getElementById("denom-coins")?.value) || 0;

    const totalCounted = (d1000*1000) + (d500*500) + (d200*200) + (d100*100) + (d50*50) + (d20*20) + (d10*10) + (d5*5) + (d2*2) + (d1*1) + coins;
    const diff = totalCounted - calc.expected_cash;

    const payload = {
      closing_date: this.activeDate,
      opening_cash: calc.opening_cash,
      sales_cash: calc.sales_cash,
      due_collection_cash: calc.due_collection_cash,
      shortage_adjustment: calc.shortage_adjustment,
      total_inflow: calc.total_inflow,
      expenses_outflow: calc.expenses_outflow,
      other_outflow: calc.other_outflow,
      expected_cash: calc.expected_cash,
      counted_cash: totalCounted,
      difference: diff,
      status: diff === 0 ? "Matched" : (diff < 0 ? "Short" : "Excess"),
      notes: document.getElementById("closing-notes")?.value || "",
      denominations: {
        d_1000: d1000, d_500: d500, d_200: d200, d_100: d100,
        d_50: d50, d_20: d20, d_10: d10, d_5: d5, d_2: d2, d_1: d1,
        coins_total: coins
      }
    };

    const res = await API.call("save_cash_closing", payload);
    if (res.success) {
      UI.toast("Daily Cash Closing saved successfully!", "success");
      this.loadDateData(this.activeDate);
    } else {
      UI.toast(res.message || "Failed to save closing", "error");
    }
  },

  printVoucher: function() {
    const calc = this.currentCalculation;
    if (!calc) return;
    const counted = document.getElementById("val-counted-cash").innerText;
    const diff = document.getElementById("val-difference").innerText;
    const status = document.getElementById("badge-closing-status").innerText;

    const html = `
      <div id="print-area" class="printable-voucher">
        <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 1rem;">
          <h2 style="font-size: 1.5rem; font-weight: 800; color: #000;">AS Computer</h2>
          <p style="font-size: 0.85rem; color: #333;">Daily Cash Closing Voucher</p>
          <p style="font-size: 0.85rem; color: #333;">Business Date: <strong>${this.activeDate}</strong></p>
        </div>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 1rem;" border="1">
          <tr><td style="padding: 6px;">Opening Cash</td><td style="padding: 6px; text-align: right;">${Utils.formatCurrency(calc.opening_cash)}</td></tr>
          <tr><td style="padding: 6px;">Sales Cash Received</td><td style="padding: 6px; text-align: right;">${Utils.formatCurrency(calc.sales_cash)}</td></tr>
          <tr><td style="padding: 6px;">Due Collection Cash</td><td style="padding: 6px; text-align: right;">${Utils.formatCurrency(calc.due_collection_cash)}</td></tr>
          <tr><td style="padding: 6px;">Expenses Outflow</td><td style="padding: 6px; text-align: right;">${Utils.formatCurrency(calc.expenses_outflow)}</td></tr>
          <tr><td style="padding: 6px;">Purchases / Other Outflow</td><td style="padding: 6px; text-align: right;">${Utils.formatCurrency(calc.other_outflow)}</td></tr>
          <tr style="font-weight: 700; background: #f0f0f0;"><td style="padding: 6px;">Expected Cash</td><td style="padding: 6px; text-align: right;">${Utils.formatCurrency(calc.expected_cash)}</td></tr>
          <tr style="font-weight: 700;"><td style="padding: 6px;">Counted Cash</td><td style="padding: 6px; text-align: right;">${counted}</td></tr>
          <tr style="font-weight: 700;"><td style="padding: 6px;">Difference / Status</td><td style="padding: 6px; text-align: right;">${diff} (${status})</td></tr>
        </table>
        <div style="margin-top: 2rem; display: flex; justify-content: space-between; font-size: 0.85rem;">
          <div>___________________<br>Closing Staff</div>
          <div>___________________<br>Owner / Director</div>
        </div>

    UI.modal("Daily Cash Closing Voucher", html, () => {

    "cash-closing": CashClosingView,
    reports: ReportsView
  },

  init: function() {
    window.addEventListener("hashchange", () => {
      this.handleRoute();
    });
    this.handleRoute();
  },

  navigate: function(tabName) {
    window.location.hash = "#" + tabName;
  },

  handleRoute: function() {
    const hash = window.location.hash.replace("#", "") || "dashboard";
    State.activeTab = hash;

    // Update active nav item
    document.querySelectorAll(".nav-item").forEach(item => {
      if (item.getAttribute("data-tab") === hash) {
        item.classList.add("active");
      } else {
        item.classList.remove("active");
      }
    });

    const view = this.routes[hash] || Dashboard;
    if (view && typeof view.render === "function") {
      view.render();
    }
  }
};

// --- app.js ---
/**
 * AS Computer - app.js
 * Main Application Bootstrap & Service Worker Registration
 */
const App = {
  init: async function() {
    const startTime = performance.now();
    console.log("Starting AS Computer PWA...");

    // 1. Initialize IndexedDB
    try {
      await DB.init();
    } catch(e) {
      console.warn("IndexedDB init error:", e);
    }

    // 2. Initialize router & auth
    AuthView.checkSession();
    Sync.init();
    Router.init();

    // 3. Register Service Worker for offline PWA caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log("Service Worker registered successfully:", reg.scope))
        .catch(err => console.warn("Service Worker registration failed:", err));
    }

    // 4. Background Bootstrap Data Fetch
    API.bootstrap();

    const loadTimeMs = (performance.now() - startTime).toFixed(2);
    console.log(`AS Computer Application Shell loaded in ${loadTimeMs} ms`);
  }
};

document.addEventListener("DOMContentLoaded", () => {
  App.init();
});

  </script>
